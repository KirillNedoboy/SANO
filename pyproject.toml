[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-care-proof-kit"
version = "0.3.0"
description = "Open-source self-hosted personal and family health workspace with reusable trust infrastructure for sensitive personal AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "fastapi>=0.111.0",
  "jinja2>=3.1.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pypdf>=6.13,<7",
  "Pillow>=12.3,<13",
  "pypdfium2>=5.13,<6",
]

[project.urls]
Homepage = "https://sanobot.art"
Repository = "https://github.com/KirillNedoboy/open-care-proof-kit"
Issues = "https://github.com/KirillNedoboy/open-care-proof-kit/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "httpx>=0.27.0",
]
sentient = [
  "sentient-agent-framework==0.3.0",
]

[project.scripts]
opencare-trust = "app.agent_trust.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "evals*"]

[tool.setuptools.package-data]
app = ["static/*.css", "static/*.js", "static/**/*", "templates/*.html", "assets/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "evals"]

[[tool.mypy.overrides]]
module = "sentient_agent_framework.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.integrations.sentient.*"
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "provider_*.py"]
