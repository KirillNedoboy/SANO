name: Bug report
description: Report a reproducible problem using synthetic or non-sensitive data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Do not include medical records, personal health information, family or
        genetic data, passwords, API keys, tokens, account credentials, or
        private deployment logs containing secrets. Use synthetic examples only.
        Report security issues privately using SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe one observable problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the steps and synthetic inputs needed to reproduce it.
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, SANO version, and relevant non-sensitive configuration.
    validations:
      required: true
